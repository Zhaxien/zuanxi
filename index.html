<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuanxi Music Player</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { margin-bottom: 20px; text-align: center; }
        h1 { font-weight: 300; color: #1DB954; font-size: 2rem; }
        #status { color: #888; font-size: 0.9rem; }

    
        #player-window {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 16 / 9;
            margin-bottom: 25px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }


        .metro-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .tile {
            aspect-ratio: 1 / 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.1s;
        }

        .tile:active { transform: scale(0.95); }
        .blue { background: #0078D7; }
        .purple { background: #7232AD; }
        .green { background: #107C10; }
        .orange { background: #D83B01; }

        .tile h3 { margin: 0; font-size: 0.95rem; line-height: 1.2; }
        .tile p { margin: 5px 0 0 0; font-size: 0.75rem; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <h1>Zuanxi Music</h1>
        <p id="status">Klik kotak untuk putar musik</p>
    </header>

    <div id="player-window">
        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#444;">
            Pilih lagu di bawah
        </div>
    </div>

    <div class="metro-grid">
        <div class="tile blue" onclick="putarLagu('a998E_qO874', 'Gala Bunga Matahari')">
            <h3>Gala Bunga Matahari</h3>
            <p>Sal Priadi</p>
        </div>

        <div class="tile purple" onclick="putarLagu('mR9V-UoB1Dk', 'Sial')">
            <h3>Sial</h3>
            <p>Mahalini</p>
        </div>

        <div class="tile green" onclick="putarLagu('vPj4p-Ew7xQ', 'Nanti Kita Seperti Ini')">
            <h3>Nanti Kita...</h3>
            <p>Batas Senja</p>
        </div>

        <div class="tile orange" onclick="putarLagu('xNByS7jIAs4', 'Satu Bulan')">
            <h3>Satu Bulan</h3>
            <p>Bernadya</p>
        </div>
    </div>

    <script>
        function putarLagu(id, judul) {
            const player = document.getElementById('player-window');
            // Gunakan link YouTube Embed yang lebih stabil
            player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            
            document.getElementById('status').innerText = "Memutar: " + judul;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>

</body>
</html>
