<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuanxi Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Zuanxi Music</h1>
            <input type="text" id="search" placeholder="Cari lagu...">
        </header>

        <div class="main-content">
            <div id="playlist">
                <div class="song-card" onclick="putar('a998E_qO874', 'Gala Bunga Matahari', 'Sal Priadi')">
                    <div class="info">
                        <h3>Gala Bunga Matahari</h3>
                        <p>Sal Priadi</p>
                    </div>
                </div>

                <div class="song-card" onclick="putar('mR9V-UoB1Dk', 'Sial', 'Mahalini')">
                    <div class="info">
                        <h3>Sial</h3>
                        <p>Mahalini</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="player-bar">
            <div id="player-display">
                <iframe id="youtube-frame" src="" allow="autoplay"></iframe>
            </div>
            <div class="now-playing">
                <h4 id="target-judul">Pilih Lagu</h4>
                <p id="target-artis">-</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
