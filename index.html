<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuanxi Music</title>
    <style>
        /* Gaya dasar */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #000;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #1DB954;
        }

        h1 { color: #1DB954; margin: 0; }

        /* Kartu Musik */
        .container {
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .music-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .btn-play {
            background-color: #1DB954;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zuanxi Music</h1>
    </header>

    <div class="container">
        <div class="music-card">
            <h3>Lagu Favorit</h3>
            <p>Klik tombol di bawah untuk menyapa!</p>
            <button class="btn-play" onclick="putar()">Mainkan Musik</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Zuanxi Project - SMK 12th Grade
    </footer>

    <script>
        function putar() {
            alert("Fitur musik akan segera hadir! Sekarang web ini sudah aktif.");
        }
    </script>

</body>
</html>
