<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuanxi Music Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Kashi Library untuk lirik sinkron -->
    <script src="https://unpkg.com/kashi@3.0.2/kashi.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Zuanxi Music</h1>
            <input type="text" id="search" placeholder="Cari musik...">
        </header>

        <div class="main-content">
            <div id="lyric-screen" class="lyric-container">
                <div id="lyric-text">🎵 Pilih lagu untuk melihat lirik... 🎵</div>
            </div>

            <div id="playlist"></div>
        </div>

        <div class="player-bar">
            <audio id="main-audio" controls></audio>
            <div class="now-playing">
                <h4 id="target-judul">Zuanxi Player</h4>
                <p id="target-artis">Local Stream</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
