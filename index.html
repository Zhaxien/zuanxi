<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuanxi Spotify Clone</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Container Utama */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar (Menu Kiri) */
        .sidebar {
            width: 240px;
            background-color: #000;
            padding: 20px;
            display: none; /* Sembunyi di HP agar tidak sempit */
        }

        @media (min-width: 768px) {
            .sidebar { display: block; }
        }

        /* Daftar Lagu */
        .content {
            flex: 1;
            background: linear-gradient(#121212, #000);
            padding: 20px;
            overflow-y: auto;
        }

        h1 { font-size: 2rem; margin-bottom: 20px; }

        .song-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .song-item:hover { background-color: rgba(255,255,255,0.1); }

        .song-item img {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            margin-right: 15px;
        }

        .song-info h3 { margin: 0; font-size: 1rem; }
        .song-info p { margin: 5px 0 0 0; font-size: 0.8rem; color: #b3b3b3; }

        /* Bottom Player Bar (Bagian Bawah) */
        .player-bar {
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            bottom: 0;
        }

        .current-song { width: 30%; display: flex; align-items: center; }
        .player-controls { width: 40%; text-align: center; }
        .player-controls audio { width: 100%; height: 30px; filter: invert(100%); }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="color: #1DB954;">Spotify</h2>
            <p>Home</p>
            <p>Search</p>
            <p>Your Library</p>
        </div>

        <div class="content">
            <h1>Good Afternoon</h1>
            <div id="song-list">
                <div class="song-item" onclick="playMusic('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Song One', 'Artist Name')">
                    <img src="https://via.placeholder.com/50/1DB954/white?text=1" alt="Cover">
                    <div class="song-info">
                        <h3>Song One</h3>
                        <p>Artist Name</p>
                    </div>
                </div>
                <div class="song-item" onclick="playMusic('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'Song Two', 'Artist Name')">
                    <img src="https://via.placeholder.com/50/1DB954/white?text=2" alt="Cover">
                    <div class="song-info">
                        <h3>Song Two</h3>
                        <p>Artist Name</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="current-song">
            <div class="song-info">
                <h3 id="playing-title">Pilih Lagu</h3>
                <p id="playing-artist">-</p>
            </div>
        </div>
        <div class="player-controls">
            <audio id="main-audio" controls src=""></audio>
        </div>
    </div>

    <script>
        function playMusic(url, title, artist) {
            const audio = document.getElementById('main-audio');
            audio.src = url;
            audio.play();
            
            document.getElementById('playing-title').innerText = title;
            document.getElementById('playing-artist').innerText = artist;
        }
    </script>

</body>
</html>
